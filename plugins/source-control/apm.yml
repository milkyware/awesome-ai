name: source-control
version: 0.1.2
description: >-
  Name branches and record changes with Conventional Commits discipline using
  structured, gated workflows.
author: MilkyWare
license: MIT
targets:
  - copilot
  - claude
  - opencode
dependencies:
  apm: []
  mcp:
    - name: github
      registry: false
      transport: stdio
      command: docker
      args:
        - run
        - "-i"
        - "--rm"
        - "-p"
        - 127.0.0.1:8085:8085
        - "-e"
        - GITHUB_OAUTH_CALLBACK_PORT
        - ghcr.io/github/github-mcp-server
      env:
        GITHUB_OAUTH_CALLBACK_PORT: "8085"
includes: auto
devDependencies:
  apm: []
scripts: {}
