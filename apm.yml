name: awesome-ai
version: 1.0.0
description: Curated AI skills, prompts, templates, and documentation frameworks for AI-assisted software delivery and architecture design.
author: MilkyWare
license: MIT

# Publisher (marketplace) manifest. The packages listed here are independently
# distributable APM packages, each with its own apm.yml under plugins/.
# `apm pack` compiles this block into .claude-plugin/marketplace.json, which
# Claude Code, GitHub Copilot CLI, and APM all read as the same artifact.
# Local (./) entries deliberately omit `version`. `apm pack` reads the display
# version from each package's own apm.yml, so release-please keeps the
# marketplace in sync without a second place to edit.
marketplace:
  owner:
    name: MilkyWare
    url: https://github.com/milkyware
  versioning:
    strategy: tag_pattern
  build:
    tagPattern: "{name}-v{version}"
  packages:
    - name: architecture-docs
      description: Generate Architecture Decision Records (ADRs) and High-Level Design (HLD) documents with structured, gated workflows.
      source: ./plugins/architecture-docs
    - name: devops
      description: Convert Azure DevOps pipeline templates to GitHub Actions and onboard repositories with release-please.
      source: ./plugins/devops
    - name: code-quality
      description: Review branch changes for correctness, scope and merge readiness using structured, gated workflows.
      source: ./plugins/code-quality
    - name: delivery
      description: Produce implementation-ready plans and create delivery-ready Jira tickets using structured, gated workflows.
      source: ./plugins/delivery
