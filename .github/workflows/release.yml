name: Release

on:
  push:
    tags:
      - 'architecture-docs-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install APM CLI
        uses: microsoft/apm-action@v1

      - name: Validate marketplace refs
        run: apm marketplace check

      - name: Verify version alignment and clean marketplace
        run: apm pack --check-versions --check-clean

      - name: Pack plugin bundle
        shell: bash
        run: |
          cd plugins/architecture-docs
          apm pack
          cd ../..
          find plugins -path '*/build/*' -type d -maxdepth 4 -print

      - name: Attach bundle to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          bundle="plugins/architecture-docs/build/architecture-docs-"*
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" $bundle --clobber
          else
            gh release create "$tag" $bundle --notes "APM bundle for $tag"
          fi