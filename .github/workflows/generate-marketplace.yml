name: Generate Marketplace

on:
  pull_request:
    paths:
      - .release-please-manifest.json
    types: 
      - edited
      - opened
      - ready_for_review
      - reopened
  workflow_dispatch:

jobs:
  job:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Generate marketplace.json
        uses: ./.github/actions/generate-marketplace
        with:
          name: awesome-ai
          owner: MilkyWare

      - uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7
        with:
          commit_message: 'chore: Generated Marketplace'