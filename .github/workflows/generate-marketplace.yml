name: Generate Marketplace

on:
  pull_request:
    paths:
      - .release-please-manifest.json
    types: 
      - edited
      - opened
      - ready_for_review
      - reopened
  workflow_dispatch:

jobs:
  job:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Generate marketplace.json
        uses: ./.github/actions/generate-marketplace
        with:
          name: awesome-ai
          owner: MilkyWare

      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: 'chore: Generated Marketplace'