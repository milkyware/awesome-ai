name: Generate Marketplace

on:
  pull_request:
    paths:
      - apm.yml
      - plugins/**/apm.yml
      - plugins/**/plugin.json
      - .release-please-manifest.json
    types:
      - edited
      - opened
      - ready_for_review
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

jobs:
  job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install APM CLI
        uses: microsoft/apm-action@v1

      - name: Generate .claude-plugin/marketplace.json
        run: apm pack

      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: 'chore: Generated Marketplace'