name: Spell Check

on:
  pull_request:

jobs:
  spell-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        
      - name: Run Spell Check
        uses: streetsidesoftware/cspell-action@v8
        id: spell-check
        with:
          suggestions: true