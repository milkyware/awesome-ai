name: Spell Check

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  job:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'renovate/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Spell Check
        uses: streetsidesoftware/cspell-action@6f3c77c1406bc930f944ba97e9801a22e42caf58 # v9.1.0
        id: spell-check
        with:
          suggestions: true

      - name: Compose spelling comment
        if: always()
        shell: pwsh
        env:
          SPELL_SUCCESS: ${{ steps.spell-check.outputs.success }}
          SPELL_FILES_CHECKED: ${{ steps.spell-check.outputs.number_of_files_checked }}
          SPELL_FILES_WITH_ISSUES: ${{ steps.spell-check.outputs.number_of_files_with_issues }}
          SPELL_ISSUES: ${{ steps.spell-check.outputs.number_of_issues }}
          SPELL_FILES_WITH_ISSUES_JSON: ${{ steps.spell-check.outputs.files_with_issues }}
        run: |
          $success = [bool]::Parse($env:SPELL_SUCCESS)
          $icon = if ($success) { '✅' } else { '❌' }
          $header = if ($success) { 'Spell check passed' } else { 'Spell check failed' }
          $checked = $env:SPELL_FILES_CHECKED
          $fileCount = $env:SPELL_FILES_WITH_ISSUES
          $issues = $env:SPELL_ISSUES
          $list = @($env:SPELL_FILES_WITH_ISSUES_JSON | ConvertFrom-Json) -join "`n"
          $runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'

          $failure = ''
          if ($success -ne 'true') {
            $failure = @"
          Please fix the typos, or add intentional words to ``words:`` in ``cspell.config.yaml``.

          <details>
          <summary>Affected files</summary>

          ``````text
          $list
          ``````

          </details>
          "@
          }

          $comment = @"
          ### $icon $header

          - Files checked: $checked
          - Files with issues: $fileCount
          - Spelling issues: $issues

          $failure

          ---
          [View workflow run]($runUrl)
          "@

          $comment | Set-Content -Path comment.md

      - name: Update sticky comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: "spell-check"
          path: comment.md
          skip_unchanged: true
