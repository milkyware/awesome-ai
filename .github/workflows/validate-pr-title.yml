name: Validate PR Title

on:
  pull_request:

jobs:
  job:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Semantic PR Title Check
      uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
      id: semantic-pr
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Add Invalid PR Title Comment
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      if: always() && steps.semantic-pr.outputs.error_message != ''
      with:
        header: pr-title-lint-error
        recreate: true
        message: |
          This pull request title does not match the required Conventional Commits format.

          Details:

          ```
          ${{ steps.semantic-pr.outputs.error_message }}
          ```

    - name: Delete Invalid PR Title Comment
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      if: always() && steps.semantic-pr.outputs.error_message == ''
      with:
        header: pr-title-lint-error
        delete: true