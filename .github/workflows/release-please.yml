name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions: 
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases: ${{ steps.release-matrix.outputs.releases }}
      has-releases: ${{ steps.release-matrix.outputs.has-releases }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_TOKEN_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_TOKEN_PEM }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release-please
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Build Release Matrix
        id: release-matrix
        shell: pwsh
        env:
          OUTPUTS: ${{ toJSON(steps.release-please.outputs) }}
          PATHS_RELEASED: ${{ steps.release-please.outputs.paths_released }}
        run: |
          $outputs = $env:OUTPUTS | ConvertFrom-Json -AsHashtable
          $pathsReleased = @($env:PATHS_RELEASED | ConvertFrom-Json)

          $releases = [System.Collections.ArrayList]::new()
          $pathsReleased | ForEach-Object {
              $p = $_
              $r = [PSCustomObject]@{
                  path = $p
                  tag = $outputs["$p--tag_name"]
                  version = $outputs["$p--version"]
              }
              $releases.Add($r) | Out-Null
          }
          $matrix = @{
              include = $releases
          }
          $matrixJson = $matrix | ConvertTo-Json -Compress
          "releases=$matrixJson" | Add-Content $env:GITHUB_OUTPUT

          $flag = 'false'
          if ($releases.Count -gt 0) { $flag = 'true' }
          "has-releases=$flag" | Add-Content $env:GITHUB_OUTPUT

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.has-releases == 'true' }}
    uses: $/.github/workflows/release-plugin.yml
    permissions:
      contents: write
    strategy:
      matrix: ${{ fromJSON(needs.release-please.outputs.releases) }}
    with:
      plugin-path: ${{ matrix.path }}
      tag: ${{ matrix.tag }}
