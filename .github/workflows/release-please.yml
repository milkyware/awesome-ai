name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.releases.outputs.releases }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_TOKEN_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_TOKEN_PEM }}

      - name: Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release-please
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Resolve released components
        id: releases
        shell: pwsh
        env:
          PATHS: ${{ steps.release-please.outputs.paths_released }}
        run: |
          $manifest = Get-Content -Raw .release-please-manifest.json | ConvertFrom-Json
          $paths = @($env:PATHS | ConvertFrom-Json)
          $objects = @($paths | ForEach-Object {
            $p = $_
            $version = $manifest.$p
            if (-not $version) { throw "No version in manifest for $p" }
            [pscustomobject]@{
              path    = $p
              version = $version
              tag     = "$(($p -split '/')[-1])-v$version"
            }
          })
          $json = '[' + (@($objects | ForEach-Object { $_ | ConvertTo-Json -Compress }) -join ',') + ']'
          "releases=$json" | Add-Content $env:GITHUB_OUTPUT

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.release-please.outputs.releases) }}
    uses: ./.github/workflows/release-plugin.yml
    with:
      plugin-path: ${{ matrix.path }}
      tag: ${{ matrix.tag }}